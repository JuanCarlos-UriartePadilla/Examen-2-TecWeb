<div class="reserva-container">
  <h2>Reserva tu habitación</h2>
  <form (ngSubmit)="reservar()">
    <label>Nombre completo:
      <input type="text" [(ngModel)]="nombre" name="nombre" required />
    </label>

    <label>Tipo de habitación:
      <select [(ngModel)]="roomPrice" name="habitacion" required>
        <option [ngValue]="100">Individual ($100/noche)</option>
        <option [ngValue]="150">Doble ($150/noche)</option>
        <option [ngValue]="200">Familiar ($200/noche)</option>
        <option [ngValue]="250">Suite ($250/noche)</option>
      </select>
    </label>

    <label>Fecha de ingreso:
      <!--input type="date" [(ngModel)]="fechaIngreso" [min]="minDate" required /-->
      <input type="date" [(ngModel)]="fechaIngreso" name="fechaIngreso" [min]="minDate" required />
    </label>

    <label>Fecha de salida:
      <!--input type="date" [(ngModel)]="fechaSalida" [min]="minDate" required /-->

      <input type="date" [(ngModel)]="fechaSalida" name="fechaSalida" [min]="minDate" required />
    </label>

    <div class="servicios">
      <p><strong>Servicios adicionales:</strong></p>
      <label><input type="checkbox" name="spa" [(ngModel)]="services.spa"> Spa $50</label>
  <label><input type="checkbox" name="desayuno" [(ngModel)]="services.breakfast"> Desayuno $20</label>
  <label><input type="checkbox" name="transporte" [(ngModel)]="services.transport"> Transporte $30</label><br><br>
    </div>
  
    <div class="confirmacion" *ngIf="confirmationMessage">
      {{ confirmationMessage }}
    </div>

    <button type="submit">Reservar</button><p> </p>
  </form>

  
  <button (click)="irAHabitaciones()">Regresar</button>
</div>
