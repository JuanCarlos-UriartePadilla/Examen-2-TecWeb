<div class="login-container">
  <h2>Login</h2>
  <form (ngSubmit)="login()">
    <input type="text" [(ngModel)]="username" placeholder="Username" name="username" required />
    <input type="password" [(ngModel)]="password" placeholder="Password" name="password" required />
    <button type="submit">Login</button>
  </form>
  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
</div>

<footer>
  <p>Proyecto Universitario desarrollado como parte del curso de Tecnologías Web Universidad Autónoma de Aguascalientes 2025</p>
</footer>
